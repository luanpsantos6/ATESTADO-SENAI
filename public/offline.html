<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d91">
  <title>Sem conexão — SENAI MT</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#eef3fc; color:#1c2330; padding:24px; }
    .card { background:#fff; border-radius:16px; box-shadow:0 8px 30px rgba(11,61,145,.12); padding:32px 24px; max-width:380px; text-align:center; }
    img { height:36px; margin-bottom:16px; }
    h1 { font-size:20px; margin:0 0 8px; color:#0b3d91; }
    p { margin:0 0 20px; color:#5b6475; line-height:1.5; font-size:15px; }
    button { background:#1d4ed8; color:#fff; border:0; border-radius:10px; padding:12px 22px; font-size:15px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/senai-logo.png" alt="SENAI">
    <h1>Você está sem internet</h1>
    <p>O Sistema de Atestados precisa de conexão para funcionar. Verifique seu Wi-Fi ou dados móveis e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
